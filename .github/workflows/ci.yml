name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Emacs ${{ matrix.emacs }} / Tree-sitter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: ${{ matrix.emacs }}
      - name: Check loading and setup without grammars
        run: |
          emacs -Q --batch -L lisp -l scripts/setup-test.el
      - name: Install both Markdown grammars
        run: |
          emacs -Q --batch -L lisp -l markdown-modern-ts \
            -f markdown-modern-install-grammars
      - name: Compile, lint, test and install the tarball
        run: make ci
      - name: Check installation from a fresh Git checkout
        run: |
          emacs -Q --batch -l scripts/install-test.el vc "$PWD"
          emacs -Q --batch -l scripts/install-test.el use-package "$PWD"

  upstream-grammars:
    name: Emacs 31.1 / upstream grammars
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: '31.1'
      - name: Install both Markdown grammars from the upstream default branch
        run: |
          emacs -Q --batch -L lisp -l markdown-modern-ts --eval '
            (let ((markdown-modern-ts--grammar-sources
                   (mapcar (lambda (source)
                             (list (nth 0 source) (nth 1 source) nil (nth 3 source)))
                           markdown-modern-ts--grammar-sources)))
              (markdown-modern-install-grammars)
              (message "Markdown grammar ABI: %s"
                       (treesit-language-abi-version (quote markdown))))'
      - name: Run all tests
        run: make test
